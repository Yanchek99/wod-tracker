# CrossFit's posted Stimulus and Strategy claims, used ONLY to check the stimulus calculator
# (StimulusAccuracy, `bin/rails stimulus:accuracy`). Never an input to the calculation.
#
# Keyed by workout name. Sources: crossfit_text (a daily workout's posted Stimulus and Strategy --
# those days aren't seeded, so they match in production only), open_leaderboard (public Open
# leaderboard, men's Rx 80th-95th percentile; `bin/rails stimulus:open_leaderboard_claims`),
# benchmark_page (crossfit.com/benchmark/<name>, Rx'd line), hero_page and guide (L1/L2 training
# guides, cited). Non-crossfit_text claims must
# name a seeded workout. CrossFit's prose itself is not copied here -- it lives in the workout's
# intended_stimulus_notes. crossfit_text claims were drafted with `bin/rails stimulus:propose_claims`
# and corrected by reading each text; owner review.
# Claim kinds: result / finish_seconds / round_seconds / rounds / percent_1rm ([low, high] in the
# workout's score unit, null = open), loading / sets_max / duration_max ({ movement name => value }).
