# CrossFit's posted Stimulus and Strategy claims, used ONLY to check the stimulus calculator
# (StimulusAccuracy, `bin/rails stimulus:accuracy`). Never an input to the calculation.
#
# Keyed by workout name (CF-YYMMDD names match across environments). CrossFit's prose itself is
# not copied here -- it lives in the workout's intended_stimulus_notes. Drafted with
# `bin/rails stimulus:propose_claims` and then corrected by reading each text; owner review.
# Claim kinds: finish_seconds / round_seconds / rounds / percent_1rm ([low, high], null = open),
# loading / sets_max / duration_max ({ movement name => value }).
