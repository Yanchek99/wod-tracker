# Published stimulus claims for seeded workouts, used ONLY to check the stimulus calculator
# (StimulusAccuracy, `bin/rails stimulus:accuracy`). Never an input to the calculation.
#
# Every claim names a seeded workout, so the check runs in any seeded environment (a test enforces
# it). Sources:
#   open_leaderboard -- public Open leaderboard, men's Rx 80th-95th percentile
#                       (`bin/rails stimulus:open_leaderboard_claims`)
#   benchmark_page   -- crossfit.com/benchmark/<name>, the Rx'd line
#   hero_page        -- crossfit.com Hero pages (only Murph states a target)
#   guide            -- CrossFit L1/L2 Training Guides, page cited
#   crossfit_text    -- CrossFit's posted Stimulus and Strategy on a seeded workout (e.g. a reposted
#                       benchmark), drafted with `bin/rails stimulus:propose_claims` and checked by hand
# Claim kinds: result / finish_seconds / round_seconds / rounds / percent_1rm ([low, high] in the
# workout's score unit, null = open), loading / sets_max / duration_max ({ movement name => value }).
