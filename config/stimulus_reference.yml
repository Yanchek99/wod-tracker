# Reference table for the intended-stimulus calculator (#1992, cf/docs/decisions.md 2026-11-11).
#
# The reference athlete is the Rx gym athlete: a strong regular at an affiliate, the athlete
# CrossFit says Rx is written for (Programming Basics pt 1) -- not a Games athlete.
#
# CrossFit publishes only a handful of these numbers. Every value says where it came from:
# a CrossFit citation, or "drafted -- owner review" (a starting value to be corrected against
# CrossFit's posted stimulus with `bin/rails stimulus:accuracy`).
#
# paces: seconds per unit for the reference athlete moving at intended pace.
#   unit keys: rep, meter, calorie, second.
#   A loaded movement's pace depends on its load class: { light:, moderate:, heavy: }.
# reference_load: the reference athlete's 1-rep max (male, lb). Loading = prescribed load /
#   reference_load, against the lift class's light boundary and the heavy boundary.
#   Implements (dumbbell, kettlebell, medicine ball, carries) use a heavy-implement reference
#   instead of a 1RM.

constants:
  # Programming Basics pt 1: "about 10-15 seconds" between movements.
  transition_seconds: 10
  # Rochet, "Hitting the Stimulus" (crossfit.com): the slower target is about 2x the fastest.
  slow_factor: 2
  # L2 guide p36: heavy-day working sets "at or above 80-85 percent" of a 1RM.
  heavy_boundary: 0.85
  # CrossFit's paired Rx loads: 65/95, 95/135, 155/225 (about 0.7).
  female_reference_factor: 0.7
  # Expected unbroken chunk per load class, for the "N sets or fewer" guide. Drafted -- owner review.
  chunk_reps:
    light: 15
    moderate: 7
    heavy: 2
  # One effort's duration cut-offs for effort labels (app's own scale). Drafted -- owner review.
  effort_seconds:
    sprint: 60
    hard: 180
    threshold: 600
  # L2 guide (Clean and Jerk 3-3-3-3-3 intended stimulus): 3-5 minutes between heavy sets.
  heavy_rest_seconds: [180, 300]
  # L2 guide p36: working sets generally at or above 80-85 percent of 1RM.
  heavy_working_percent_low: 80

lift_classes:
  # Light below this share of the reference load. Drafted -- owner review, checked against
  # CrossFit's labels: Amanda's 135 snatch and Elizabeth's 135 clean are moderate (L2 pp54, 68),
  # Diane's 225 deadlift is "Medium" (L2 p64).
  olympic:
    light_below: 0.45
  barbell:
    light_below: 0.50
  implement:
    light_below: 0.50

